# Web Application Port Configuration
server.port=8080

# Spring Data MongoDB Connection Settings
# Assumes MongoDB is running locally on the default port 27017. 
# Creates a database named 'fakenewsdb' automatically if it does not exist.
spring.data.mongodb.uri=mongodb://localhost:27017/fakenewsdb

# Internal View Engine Resolvers Setup
# Directs Spring to recognize custom HTML/EJS files inside our resources views structure.
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.ejs

# Logging Configurations (Optional - set to show clear details in console)
logging.level.org.springframework.web=INFO
://level.com.app=DEBUG
# Link external public asset directory for JavaScript assets
spring.web.resources.static-locations=file:../public/,classpath:/static/
